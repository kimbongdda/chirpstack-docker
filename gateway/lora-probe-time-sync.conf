# 설치: /etc/systemd/system/lora-probe.service.d/time-sync.conf
#
# RTC 가 없어 부팅 직후 시계는 fake-hwclock 이 복원한 옛 시각이다 (마지막 저장 시점).
# 그 상태로 시작하면 run ID 와 첫 t1 이 수 주 전 시각으로 찍히므로 NTP 동기화를 기다린다.
#
# systemd-time-wait-sync.service 를 켜는 대신 여기서 기다리는 이유:
# 그쪽은 TimeoutStartSec=infinity 라 Starlink 가 안 붙은 채 부팅하면 time-sync.target 에
# 걸린 유닛이 전부 영원히 멈춘다. 여기서는 최대 5분만 기다리고, 그래도 안 되면 그냥
# 시작한다 (나중에 시계가 스텝하면 probe_client.py 가 새 run 으로 넘어간다).
[Unit]
After=time-sync.target

[Service]
ExecStartPre=-/usr/bin/timeout 300 /bin/sh -c 'until [ "$(timedatectl show -p NTPSynchronized --value)" = yes ]; do sleep 2; done'
TimeoutStartSec=360
